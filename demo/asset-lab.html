<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯火大排档 素材与动效检查</title><style>
body{margin:0;padding:22px;background:#fff6e5;color:#603b26;font-family:-apple-system,"PingFang SC",sans-serif}main{max-width:1160px;margin:auto}h1{font-size:24px;margin:0 0 10px}p{line-height:1.65}button,select{font:inherit;padding:10px 14px;border:1px solid #d4b78d;border-radius:12px;background:#ffedcc;color:#603b26}button{cursor:pointer}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}.layout{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:26px}.hero img{width:100%;max-width:520px;display:block}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tiles button{padding:8px 3px;font-size:13px;background:#fffaf1}.tiles img{width:100%;height:90px;object-fit:contain}.meta{font-size:14px}.ingredients{display:flex;gap:10px;flex-wrap:wrap}.ingredients figure{margin:0;text-align:center;font-size:14px}.ingredients img{width:70px;height:70px;object-fit:contain}.dark{background:#17383a;border-radius:20px}.dark p{color:#fff1d4}@media(max-width:720px){.layout{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,1fr)}body{padding:12px}}</style></head><body><main><h1>灯火大排档 素材与动效检查</h1><p>选择一道菜，检查配方、透明素材和同一套出锅换单动效。这里是单菜预览；完整节奏以已确认动画为准。</p><div class="tools"><label>菜品 <select id="recipe-select"></select></label><button id="play-recipe">演示这道菜</button><button id="toggle-bg">检查深色底</button><a href="approved-animation.html">打开已确认整段动画</a></div><div class="layout"><div><div id="dd-asset-preview" aria-label="灯火大排档满槽备菜与快速换单">

    <div style="display:none" class="oc-controls" aria-label="动画控制">
      <button type="button" data-action="pause">播放</button>
      <button type="button" data-action="replay">重播</button>
      <button type="button" data-seek="3.40">看出锅</button>
      <button type="button" data-seek="1.88">看满槽</button>
      <button type="button" data-seek="10.90">看通关</button>
    </div>
    <div class="oc-stage viz-dotted-background"><div class="oc-phone">
      <canvas width="928" height="1695" role="img" aria-label="灯火大排档。已备食材直接铺满整个槽位，图案不拉伸。出锅后盘子立即移动，飞行距离加长；成品在菜单区域出现、结算后立即退出，逐桌补入新订单。">灯火大排档订单动画</canvas>
      <div class="oc-hit-layer" aria-label="食材点击区"></div>
      <div class="oc-result" role="dialog" aria-modal="true" aria-labelledby="asset-clear-title" aria-describedby="asset-clear-detail" hidden>
        <h2 id="asset-clear-title" class="oc-sr">通关成功</h2>
        <p id="asset-clear-detail" class="oc-sr" data-result-detail>本关用时00:10。要进入下一关吗？</p>
        <button type="button" class="oc-result-button cursor-interaction" data-result-action="next">下一关</button>
        <button type="button" class="oc-result-button cursor-interaction" data-result-action="rest">先休息一下</button>
      </div>
    </div></div>
    <div class="oc-caption" aria-live="polite"></div>
  
</div>
<style>

#dd-asset-preview{--oc-ink:light-dark(#603921,#f9e2c1);--oc-control:light-dark(#fff4e1,#35271e);--oc-line:light-dark(#dfc4a0,#75573e);--oc-active:light-dark(#8e492c,#efc08a);--oc-on:light-dark(#fff7e9,#3c271b);color:var(--oc-ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;width:100%}
#dd-asset-preview .oc-controls{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#dd-asset-preview .oc-controls button{font:500 13px/1.3 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:8px 10px;min-height:36px;border:1px solid var(--oc-line);border-radius:10px;background:var(--oc-control);color:var(--oc-ink)}
#dd-asset-preview .oc-controls button[aria-pressed="true"]{background:var(--oc-active);color:var(--oc-on);border-color:var(--oc-active)}
#dd-asset-preview .oc-stage{display:flex;justify-content:center;padding:8px 0}
#dd-asset-preview .oc-phone{position:relative;width:min(100%,410px)}
#dd-asset-preview canvas{display:block;width:100%;height:auto;aspect-ratio:928/1695;border-radius:18px;background:#70411f;box-shadow:0 12px 34px #0003;pointer-events:none}
#dd-asset-preview .oc-hit-layer{position:absolute;inset:0;pointer-events:none}
#dd-asset-preview .oc-food-hit{position:absolute;padding:0;border:0;border-radius:14px;background:transparent;pointer-events:auto}
#dd-asset-preview .oc-food-hit:focus-visible{outline:3px solid #ffedbf;outline-offset:-4px}
#dd-asset-preview .oc-caption{text-align:center;font-size:13px;line-height:1.5;min-height:22px;margin-top:8px}
@media(pointer:coarse){#dd-asset-preview .oc-controls button{min-height:44px}}
@media(max-width:360px){#dd-asset-preview .oc-controls{gap:4px}#dd-asset-preview .oc-controls button{padding:8px 7px}#dd-asset-preview .oc-stage{padding:4px 0}}


#dd-asset-preview .oc-result{position:absolute;inset:0;z-index:4;pointer-events:auto}
#dd-asset-preview .oc-result[hidden]{display:none}
#dd-asset-preview .oc-result-button{position:absolute;min-height:44px;padding:0;border:0;border-radius:15px;background:transparent;color:transparent;font:500 16px/1.3 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#dd-asset-preview .oc-result-button:focus-visible{outline:3px solid #fff1c0;outline-offset:-5px}
#dd-asset-preview .oc-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

</style>
</div><div><div class="hero" id="hero"><img id="dish-image" alt="成品菜"><p id="recipe-meta"></p></div><div class="ingredients" id="recipe-ingredients"></div><h2>20道菜品</h2><div class="tiles" id="dish-tiles"></div></div></div></main><script src="../data/approved-assets.js"></script><script src="../data/catalog.js"></script><script src="../data/preview-assets.js"></script><script src="../src/asset-preview.js"></script><script>
const catalog=window.GAME_CATALOG,select=document.getElementById('recipe-select');for(const r of catalog.recipes){const o=document.createElement('option');o.value=r.id;o.textContent=r.id+' '+r.name+' · '+r.ingredientCount+'种食材';select.append(o);}select.value='d11';
function updateRecipe(play){const r=catalog.recipes.find(r=>r.id===select.value);document.getElementById('dish-image').src='../'+r.asset;document.getElementById('dish-image').alt=r.name;document.getElementById('recipe-meta').textContent=r.name+' · 基础收入 '+r.basePrice+' · 加成 ×'+r.multiplier+' · 上桌结算 '+r.payout;const items=document.getElementById('recipe-ingredients');items.replaceChildren();for(const id of r.ingredients){const ing=catalog.ingredients.find(i=>i.id===id),f=document.createElement('figure'),im=document.createElement('img'),cap=document.createElement('figcaption');im.src='../'+ing.asset;im.alt=ing.name;cap.textContent=ing.name;f.append(im,cap);items.append(f);}if(play)document.getElementById('dd-asset-preview').animation.previewRecipe(r);}
for(const r of catalog.recipes){const b=document.createElement('button'),im=document.createElement('img'),name=document.createElement('span');im.src='../'+r.asset;im.alt=r.name;name.textContent=r.id+' '+r.name;b.append(im,name);b.onclick=()=>{select.value=r.id;updateRecipe(true);};document.getElementById('dish-tiles').append(b);}select.onchange=()=>updateRecipe(true);document.getElementById('play-recipe').onclick=()=>updateRecipe(true);document.getElementById('toggle-bg').onclick=()=>document.getElementById('hero').classList.toggle('dark');updateRecipe(false);
const ready=setInterval(()=>{if(document.getElementById('dd-asset-preview').animation?.state().ready){clearInterval(ready);updateRecipe(true);}},40);
</script></body></html>
