<script>
/*__GAME_ENGINE__*/
(function(){
  'use strict';
  const root=document.getElementById('lantern-stall-preview');
  const $=selector=>root.querySelector(selector), FOOD=LanternGame.FOOD, MENU=LanternGame.MENU;
  const saved=window.openai?.widgetState?.privateContent;
  let game=new LanternGame(saved?.game?.seed||20261111,saved?.game), hintId=null, modal=null, lastFocus=null;
  let message='按小票图标挑食材，凑齐自动上菜。', celebrated=false;
  const sprites=food=>{const n=FOOD[food].sprite;return `<span class="ls-food" aria-hidden="true" style="background-position:${(n%3)*50}% ${Math.floor(n/3)*50}%"></span>`;};
  const icons={undo:'undo-2',bowl:'cooking-pot',hint:'lightbulb'};
  function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{game:'灯火排挡',served:game.served,target:game.target,coins:game.coins,status:game.status,rejected:game.rejected},privateContent:{game:game.export()}}).catch(()=>{});}
  function say(text,success=false){message=text;celebrated=success;}
  function render(){
    $('[data-coins]').textContent=game.coins;$('[data-goal]').textContent=`${game.served} / ${game.target}`;
    $('[data-meter]').style.width=(game.served/game.target*100)+'%';
    $('[data-heat]').textContent=game.combo>1?`热乎 ${game.combo} 连单`:'炉火正暖';
    $('[data-stock]').textContent=`${game.board.length-game.removed.length} 味`;
    $('[data-orders]').innerHTML=game.active.map((id,slot)=>{
      const order=MENU[id], p=game.progress(id), focus=game.focus===id;
      return `<article class="ls-ticket ${focus?'focused':''}"><button type="button" class="ls-ticket-select cursor-interaction" data-order="${id}" aria-pressed="${focus}" aria-label="优先制作${order.name}"><div class="ls-ticket-meta"><span>${String(slot+1).padStart(2,'0')} 桌</span><strong>+${order.reward}◉</strong></div><h2>${order.name}</h2><div class="ls-recipe">${p.ingredients.map(part=>`<span class="ls-ingredient ${part.ready?'ready':''}" aria-label="${FOOD[part.food].name}${part.ready?'已入盘':'尚缺'}">${sprites(part.food)}</span>`).join('')}</div></button><button type="button" class="ls-refuse cursor-interaction" data-refuse="${id}" aria-label="拒绝${order.name}，赔付${order.penalty}金币">撕单 −${order.penalty}◉</button></article>`;
    }).join('');
    const available=new Set(game.available().map(t=>t.id));
    const needed=game.focus===null?[]:game.progress(game.focus).ingredients.filter(p=>!p.ready).map(p=>p.food);
    const board=$('[data-board]');
    board.querySelectorAll('.ls-tile').forEach(el=>el.remove());
    for(const t of game.board){
      if(game.removed.includes(t.id))continue;
      const el=document.createElement('button');el.type='button';el.className=`ls-tile cursor-interaction ${available.has(t.id)&&needed.includes(t.food)?'wanted':''} ${t.id===hintId?'hinted':''}`;
      el.dataset.tile=t.id;el.disabled=!available.has(t.id)||game.status!=='playing';
      el.setAttribute('aria-label',`${FOOD[t.food].name}${available.has(t.id)?'，可拿取':'，被上层食材遮住'}`);
      el.style.cssText=`left:${t.x}%;top:${t.y}%;z-index:${t.z+1}`;el.innerHTML=sprites(t.food);board.appendChild(el);
    }
    $('[data-message]').textContent=message;$('[data-message]').className='ls-message'+(celebrated?' celebrate':'');
    $('[data-tray-count]').textContent=`${game.tray.length} / ${game.capacity}`;
    $('[data-tray]').className='ls-tray'+(game.tray.length>=game.capacity-2?' danger':'')+(game.capacity===8?' extended':'');
    const slot=id=>id===undefined?'<div class="ls-slot" aria-label="空格">·</div>':`<div class="ls-slot filled" aria-label="${FOOD[game.board[id].food].name}">${sprites(game.board[id].food)}</div>`;
    $('[data-tray]').innerHTML=Array.from({length:game.capacity},(_,i)=>slot(game.tray[i])).join('');
    $('[data-bowl]').hidden=game.charges.bowl>0;
    $('[data-bowl-slots]').innerHTML=[0,1].map(i=>slot(game.bowl[i])).join('');
    const names={undo:'撤回一步',bowl:'备菜碗',hint:'看提示'};
    $('[data-tools]').innerHTML=['undo','bowl','hint'].map(kind=>{
      const charge=game.charges[kind], exhausted=charge===0;
      let sub=kind==='bowl'?(charge?'移出末尾 2 味':'本轮已用'):charge?'余 1 次':game.adUsed?'本轮已用':'▷ 视频补充 +1';
      const disabled=game.status==='won'||(exhausted&&(kind==='bowl'||game.adUsed))||(!exhausted&&kind==='undo'&&!game.undoState)||(!exhausted&&kind==='bowl'&&!game.tray.length);
      return `<button type="button" class="ls-tool cursor-interaction" data-action="${kind}" ${disabled?'disabled':''} aria-label="${names[kind]}，${sub}"><i data-lucide="${icons[kind]}" aria-hidden="true"></i><span><b>${names[kind]}</b><small>${sub}</small></span></button>`;
    }).join('');
    if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});
    if(game.status==='jammed'&&!modal)showJam();
    if(game.status==='won'&&!modal)showWin();
  }
  function openModal(content,type){lastFocus=document.activeElement;modal=type;const overlay=$('[data-overlay]');overlay.innerHTML=`<div class="ls-modal" role="dialog" aria-modal="true" aria-labelledby="ls-dialog-title">${content}</div>`;overlay.hidden=false;overlay.querySelector('button')?.focus();}
  function closeModal(){modal=null;$('[data-overlay]').hidden=true;$('[data-overlay]').innerHTML='';if(lastFocus?.isConnected)lastFocus.focus();else $('[data-action="rules"]').focus();}
  function showRefuse(id){const o=MENU[id];if(game.rejected>=2){say('今夜已经拒单两次，先照顾好眼前的客人。');render();return;}
    openModal(`<div class="ls-modal-symbol">⌁</div><h2 id="ls-dialog-title">这份先不接？</h2><p style="text-align:center">${o.name} · 需要赔付 <strong>${o.penalty} 金币</strong></p><div class="ls-modal-detail">下一位客人立即入座。<br>已拿的食材留在托盘；这份备料会在后续变为街坊加单。<br>热乎连单中断 · 剩 ${2-game.rejected} 次拒单机会</div><div class="ls-modal-actions"><button type="button" data-action="cancel">继续做菜</button><button type="button" class="primary" data-confirm-refuse="${id}">赔 ${o.penalty}，撕单</button></div>`,'refuse');
  }
  function showRules(){openModal(`<h2 id="ls-dialog-title">今晚怎么出摊</h2><ul><li>点亮着的食材，放进七格托盘。</li><li>凑齐任意一份订单，自动做菜上桌。</li><li>多份都能做时，优先做选中的小票。</li><li>压住的牌，要先移开上层食材。</li><li>第七格先检查出餐；没出成才满盘。</li><li>四次拿取内接着出餐，可得连单小费。</li><li>完成八单收摊，多余食材不用清空。</li></ul><p>本稿包含规则与交互演示；视频补给为模拟流程。</p><div class="ls-modal-actions"><button type="button" class="primary" data-action="cancel">明白，开火</button></div>`,'rules');}
  function showJam(){
    const canUndo=game.charges.undo>0&&game.undoState, canBowl=game.charges.bowl>0;
    openModal(`<div class="ls-modal-symbol">♨</div><h2 id="ls-dialog-title">托盘有点挤</h2><p style="text-align:center">这一步没凑成菜，先腾一点地方。</p><div class="ls-modal-detail">盘里已有 ${game.tray.length} 味。${canBowl?'备菜碗还能放走末尾两味。':canUndo?'可以撤回刚拿的那味。':!game.adUsed?'看一次视频，本轮托盘增加一格。':'本轮补给已用完，重开一摊试试。'}</div><div class="ls-modal-actions"><button type="button" data-action="restart">重新出摊</button>${canBowl?'<button type="button" class="primary" data-action="bowl">用备菜碗</button>':canUndo?'<button type="button" class="primary" data-action="undo">撤回一步</button>':!game.adUsed?'<button type="button" class="primary" data-ad="revive">▷ 视频加 1 格</button>':''}</div>`,'jam');
  }
  function showWin(){openModal(`<div class="ls-modal-symbol">✦</div><h2 id="ls-dialog-title">今晚，圆满收摊</h2><p style="text-align:center">八份热乎饭，都送到客人手里啦。</p><div class="ls-result-value">${game.coins-40}</div><div class="ls-result-label">今夜净赚金币 · 已扣拒单赔付</div><div class="ls-modal-detail">已出餐 ${game.served} 单 · 拒单 ${game.rejected} 次<br>零钱累计 ${game.coins} · 出摊操作 ${game.moves} 手</div><div class="ls-modal-actions"><button type="button" data-action="restart">再摆一摊</button><button type="button" class="primary" data-action="night">下一晚预演</button></div>`,'won');}
  function showAd(kind){const text={undo:'撤回次数 +1',hint:'提示次数 +1',revive:'本轮托盘 +1 格'}[kind];openModal(`<div class="ls-modal-symbol">▷</div><h2 id="ls-dialog-title">补给一下再开火</h2><p style="text-align:center">完整观看视频后获得 <strong>${text}</strong></p><div class="ls-modal-detail">交互演示 · 未接入真实广告<br>正式版只在完整观看回调后发奖；取消或加载失败保留现场。</div><div class="ls-modal-actions"><button type="button" data-action="ad-cancel">暂时不用</button><button type="button" class="primary" data-ad-complete="${kind}">模拟完整观看</button></div>`,'ad');}
  function after(result){if(!result.ok){say(result.reason);render();return;}hintId=null;if(result.deliveries?.length){const d=result.deliveries;say(d.map(o=>`${o.name}上桌 +${o.reward+o.tip}◉`).join(' · '),true);}render();persist();}
  function restart(next=false){closeModal();game=new LanternGame(next?game.seed+1:game.seed);hintId=null;say(next?'新一晚备菜已铺好，先从小票看起。':'按小票图标挑食材，凑齐自动上菜。');render();persist();}
  function fly(from,food){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const phone=$('.ls-phone').getBoundingClientRect(),a=from.getBoundingClientRect(),b=$('[data-tray]').getBoundingClientRect();const el=document.createElement('div');el.className='ls-flight ls-food';const n=FOOD[food].sprite;el.style.cssText=`left:${a.left-phone.left}px;top:${a.top-phone.top}px;--dx:${b.left-a.left+20}px;--dy:${b.top-a.top}px;background-position:${(n%3)*50}% ${Math.floor(n/3)*50}%`;$('.ls-phone').appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});}
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||button.disabled)return;
    if(button.dataset.tile!==undefined){const id=Number(button.dataset.tile),food=game.board[id].food;fly(button,food);const result=game.pick(id);say('食材已入盘，凑齐图标就能出餐。');after(result);return;}
    if(button.dataset.order!==undefined){game.select(Number(button.dataset.order));say(`优先做${MENU[game.focus].name}，台面绿点标出缺的食材。`);render();persist();return;}
    if(button.dataset.refuse!==undefined){showRefuse(Number(button.dataset.refuse));return;}
    if(button.dataset.confirmRefuse!==undefined){const id=Number(button.dataset.confirmRefuse);closeModal();const result=game.refuse(id);say(`赔付 ${MENU[id].penalty}◉，新客人的小票已挂好。`);after(result);return;}
    if(button.dataset.ad){showAd(button.dataset.ad);return;}
    if(button.dataset.adComplete){const kind=button.dataset.adComplete;closeModal();const result=game.refill(kind);say(kind==='revive'?'应急格已加好，本轮共八格。':'补给已到账，继续开火。',true);after(result);return;}
    const action=button.dataset.action;
    if(action==='rules'){showRules();return;}
    if(action==='cancel'){closeModal();return;}
    if(action==='ad-cancel'){closeModal();if(game.status==='jammed')showJam();return;}
    if(action==='restart'||action==='night'){restart(action==='night');return;}
    if(['undo','bowl','hint'].includes(action)){
      if(game.charges[action]===0){showAd(action);return;}
      if(modal)closeModal();
      if(action==='hint'){say('正在找一条能出餐的稳妥路线…');render();setTimeout(()=>{const result=game.hint();if(result.ok){hintId=result.tileId;say('先拿高亮食材，还有一条不用道具的收摊路线。');render();persist();}else after(result);},30);return;}
      const result=action==='undo'?game.undo():game.scoop();say(action==='undo'?'这味食材放回原处，再想一手。':'末尾食材放进备菜碗，托盘腾出地方了。');after(result);
    }
  });
  root.addEventListener('keydown',event=>{
    if(!modal)return;
    if(event.key==='Escape'&&['rules','refuse','ad'].includes(modal)){event.preventDefault();const wasAd=modal==='ad';closeModal();if(wasAd&&game.status==='jammed')showJam();return;}
    if(event.key==='Tab'){const buttons=[...$('[data-overlay]').querySelectorAll('button:not(:disabled)')];const first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault();}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault();}}
  });
  window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.privateContent?.game;if(state?.version===2&&JSON.stringify(state)!==JSON.stringify(game.export())){game=new LanternGame(state.seed,state);hintId=null;if(modal)closeModal();say('上次的摊位已经接着摆好。');render();}});
  render();
})();
</script>
