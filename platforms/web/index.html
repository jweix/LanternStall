<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>灯火大排档 · 夜市小炒</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#142f2f;color:#fff0d3;font:14px/1.6 system-ui,sans-serif}
    main{display:flex;align-items:center;justify-content:center;gap:40px;min-height:100dvh;padding:20px}
    canvas{display:block;width:min(92vw,420px,calc((100dvh - 40px)*928/1695));height:auto;aspect-ratio:928/1695;border-radius:18px;box-shadow:0 20px 80px #0006;touch-action:none}
    .game-wrap{position:relative;flex:none}#controls{position:absolute;inset:0;pointer-events:none}#controls button{position:absolute;pointer-events:auto;opacity:0;border:0;background:#fff0d5;color:#66432c;border-radius:12px;font:inherit;touch-action:manipulation}#controls button:focus-visible{opacity:.92;outline:3px solid #e9ae58;outline-offset:2px}
    aside{max-width:270px}h1{font-size:28px;margin:0 0 4px}p{color:#c6d1ba}a{color:#ffd28a}nav{display:grid;gap:8px}
    #status{color:#f5ca80}small{color:#a3b8a9}@media(max-width:760px){main{padding:12px;gap:12px;flex-direction:column}aside{max-width:420px}h1{font-size:21px}aside p{margin:6px 0}nav{display:flex;flex-wrap:wrap;gap:16px}}
  </style>
</head>
<body>
<main>
  <div class="game-wrap"><canvas id="game" width="928" height="1695" aria-label="灯火大排档试玩，闯关、装扮、菜谱与夜市">请使用支持 Canvas 的浏览器。</canvas><div id="controls" aria-label="游戏操作"></div></div>
  <aside><h1>灯火大排档</h1><small>夜市小炒 · 可操作试玩</small>
    <p>点亮牌，把食材放进 7 格备菜栏。配齐订单就自动开炒，上菜获得金币，收入记录本关的累计所得。</p>
    <p>用完全部食材，等最后一道菜上桌，即可通关。</p>
    <p>撤回与暂存可以腾出空间；暂存后，点食材台右下角的小图标取回。</p>
    <p id="status" role="status">正在准备食材…</p>
    <nav aria-label="难度试玩"><a href="?level=1">第 1 摊 · 入门</a><a href="?level=2">第 2 摊 · 家常</a><a href="?level=3">第 3 摊 · 忙碌</a><a href="?level=4">第 4 摊 · 挑战</a></nav>
    <p><small>每关的菜品份数和材料预先确定，重开可复盘同一牌堆。</small></p>
    <nav><a href="demo/approved-animation.html">历史 v13 动效</a><a href="demo/asset-lab.html">20 道菜素材预览</a></nav>
    <p><small>夜市还在试营业，关卡难度仍在调整。当前版本暂未加入音效。</small></p>
  </aside>
</main>
<script src="../../shared/core/game-core.js"></script>
<script src="../../shared/core/motion.js"></script>

<script src="../../shared/rendering/stall-art.js"></script>
<script src="../../shared/rendering/scene.js"></script>
<script src="../../shared/rendering/stall-scene.js"></script>
<script src="src/play.js"></script>
</body>
</html>
