<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灯火大排档 · 关卡实验室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#233b3b;color:#fff0d3;font:15px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:26px;margin:0}p{margin:8px 0 16px;color:#d2d8c4}a{color:#ffd28a}.layout{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:24px;align-items:start}canvas#game{display:block;width:min(100%,calc((100dvh - 140px)*928/1695));height:auto;touch-action:none;background:#183b3b;border-radius:16px}.game-frame{display:flex;justify-content:center}#seed{width:170px}section{margin-bottom:20px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px}button,input,select,textarea{font:inherit;color:#60331b;background:#fff1d5;border:1px solid #c58b56;border-radius:8px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}input{width:110px}textarea{width:100%;min-height:190px;font:13px/1.6 ui-monospace,monospace;resize:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffe7b4}summary{cursor:pointer;margin:10px 0}#message{min-height:28px;color:#ffdc91}#slice{display:block;width:100%;height:auto;background:#c48b55;border-radius:12px}.small{font-size:13px}#recipe-list{color:#efdab9}#file{width:100%;max-width:350px;color:#60331b}@media(max-width:720px){main{padding:12px}.layout{grid-template-columns:1fr}.game-frame{max-width:360px;margin:auto;width:100%}.controls{gap:8px}button{min-height:44px}}
</style>
<main>
<h1>关卡实验室</h1>
<p>独立开发入口，不读写经营存档。道具按各一次免费测试。开发求解与见证读取完整信息，不能作为玩家难度；本页不产生经营奖励。</p>
<div class="layout">
<div class="game-frame"><canvas id="game" width="928" height="1695" aria-label="真实引擎关卡试玩"></canvas></div>
<div>
<section class="controls">
<label>关卡<input id="level" type="number" min="1" max="10000" value="1"></label>
<label>种子（留空用配置）<input id="seed" type="number" min="0" max="4294967295"></label>
<button id="load">加载配置</button><a href="../">返回正常游戏</a>
</section>
<div id="message" role="status">正在加载真实素材…</div>
<section><pre id="summary"></pre><div id="recipe-list"></div>
<details><summary>编辑本关菜品列表与布局</summary><textarea id="definition" aria-label="本关配置 JSON" spellcheck="false"></textarea><button id="apply">应用到独立试玩</button><p class="small">orders 是一个完整菜品列表，每个菜谱 ID 代表一份，完成当前三道中的任意一道后补入下一道。不会写回源文件。</p></details></section>
<section class="controls">
<button id="solve">完整信息求解（开发）</button><button id="step">单步执行</button><button id="witness">回放生成器解（开发）</button>
</section>
<section class="controls">
<label>无道具策略<select id="policy"><option value="greedy">当前贪心</option><option value="random">随机</option><option value="unlock">几何解锁</option></select></label>
<label>策略种子<input id="policy-seed" type="number" value="997" min="0" max="4294967295"></label><button id="probe">重置并运行策略</button>
</section>
<section><div class="controls"><label>观察层<select id="layer"><option value="all">全部层</option></select></label><span class="small">剖面仅观察，不改变左侧几何或可选状态。</span></div><canvas id="slice" width="818" height="791" aria-label="牌位、材料与层级剖面"></canvas></section>
<section class="controls"><button id="export">导出本次操作记录</button><label>导入离线记录<input id="file" type="file" accept="application/json,.json"></label></section>
<p class="small">导入记录只回放已记录的操作；广告救援步骤按测试结果复现，不播放视频、不发放经营奖励。复杂策略和五种道具预算请运行 analyze:levels。</p>
</div></div>
</main>
<script src="../../../shared/data/board-templates.js"></script>
<script src="../../../shared/data/level-config.js"></script>
<script src="../../../shared/core/board-geometry.js"></script>
<script src="../../../shared/core/level-search.js"></script>
<script src="../../../shared/core/game-core.js"></script>
<script src="../../../shared/core/motion.js"></script>
<script src="../../../shared/core/levels.js"></script>
<script src="../../../shared/data/game-ui.js"></script>
<script src="../../../shared/runtime/game-session.js"></script>
<script src="../../../shared/rendering/stall-art.js"></script>
<script src="../../../shared/rendering/approved-ui.js"></script>
<script src="../../../shared/rendering/scene.js"></script>
<script src="lab.js"></script>
</html>
