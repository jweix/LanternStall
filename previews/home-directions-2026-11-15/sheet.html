<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>首页顶部 · 四个新方向</title><style>*{box-sizing:border-box}body{margin:0;background:#142e30;color:#ffeaca;font:16px/1.65 system-ui}main{max-width:1540px;margin:auto;padding:30px}h1{font-size:30px;line-height:1.4;margin:0 0 12px}p{margin:8px 0 18px;max-width:1100px}nav{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0 26px}a{color:#ffce85}section{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}figure{margin:0;padding:12px;border-radius:14px;background:#254744;align-self:start}h2{font-size:21px;margin:0 0 5px}.desc{font-size:14px;min-height:48px;color:#e0d6be;margin-bottom:12px}img{display:block;width:100%;height:auto;border-radius:9px}.tag{display:inline-block;color:#163c35;background:#edce8e;border-radius:4px;padding:0 8px;font-size:13px;margin-right:8px}.foot{margin-top:28px;color:#bdcdbc;font-size:14px}.sheet main{width:1500px;max-width:none}.sheet section{gap:18px}.sheet .desc{min-height:48px}@media(max-width:1000px){body:not(.sheet) section{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){body:not(.sheet) main{padding:16px}body:not(.sheet) section{gap:10px}body:not(.sheet) figure{padding:8px}h2{font-size:18px}.desc{font-size:13px}}</style><body class="sheet"><main><h1>首页顶部 · 四个新方向</h1><p><a href="refined.html">已选 C · 查看细化后的前后对照 →</a></p><p><span class="tag">视觉方案，尚未接入</span>统一保留内侧大花灯、两边邻摊和完整首页内容；比较顶部结构，而不是只改颜色或按钮位置。</p><section><figure><h2>A · 青瓦门楣</h2><div class="desc">青瓦与木匾连为一体，章节收进门楣，整体规整。</div><a href="a-tiled-gateway.png" target="_blank"><img src="a-tiled-gateway.png" alt="A 青瓦门楣 完整首页视觉方案"></a></figure><figure><h2>B · 单侧店幌</h2><div class="desc">竖幌打破对称，留出夜空；空间感强，品牌阅读较慢。</div><a href="b-side-shop-banner.png" target="_blank"><img src="b-side-shop-banner.png" alt="B 单侧店幌 完整首页视觉方案"></a></figure><figure><h2>C · 夜空题字</h2><div class="desc">取消大牌匾，题字融入夜空与灯串；视线更集中于小摊。</div><a href="c-night-sky-lettering.png" target="_blank"><img src="c-night-sky-lettering.png" alt="C 夜空题字 完整首页视觉方案"></a></figure><figure><h2>D · 米布横幌</h2><div class="desc">奶油织物承托红字，章节收入下摆；保留亲切的小吃摊气质。</div><a href="d-linen-shop-sign.png" target="_blank"><img src="d-linen-shop-sign.png" alt="D 米布横幌 完整首页视觉方案"></a></figure></section><div class="foot">对标说明：H01 只说明最初首页布局；H02 说明后来的大花灯与邻摊构图。上一轮将花灯向立柱外侧移动、对横图使用竖屏居中裁切，均偏离 H02。接入时应重新确定内侧挂点与蒸笼前后关系，并为邻摊保留可见空间；不用外移或缩小花灯来避让。</div></main></body></html>
