<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灯火大排档 · 视觉问题清单</title>
<style>
:root{color-scheme:light;--ink:#60391f;--paper:#fff4dc;--line:#e3bc80;--red:#aa3924}*{box-sizing:border-box}body{margin:0;background:#193737;color:var(--ink);font:15px/1.65 system-ui,sans-serif}header{max-width:1420px;margin:auto;padding:22px 24px 18px;color:#ffedc9}h1{font-size:25px;margin:0 0 5px}header p{margin:6px 0;color:#d8d6be}header a{color:#ffda96}.metrics{font-size:18px;color:#ffda96}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 0}select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#ffe7bb;color:var(--ink)}button{cursor:pointer}button:hover{background:#fff2d6}main{max-width:1420px;margin:0 auto;padding:0 24px 30px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px}aside,article{background:var(--paper);border:1px solid var(--line);border-radius:14px}aside{padding:12px;align-self:start;position:sticky;top:12px;max-height:86vh;overflow:auto}#issues{display:grid;gap:8px}.item{width:100%;text-align:left;background:#fff8e9;padding:10px;font-size:14px}.item.selected{border:2px solid var(--red);padding:9px;background:#ffe7ca}.item small{display:block;color:#8c6b4b}.high{color:var(--red);font-weight:750}.medium{color:#956320}article{padding:20px}h2{font-size:21px;line-height:1.4;margin:0 0 8px}h3{font-size:16px;margin:16px 0 4px}.meta{color:#8c633f}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}figure{margin:0;min-width:0}figcaption{font-weight:700;margin-bottom:7px}.crop{width:100%;height:auto;aspect-ratio:680/440;background:#f2e6cc;border:1px solid #d4b57f;border-radius:8px;display:block}.full{position:relative;line-height:0}.full img{width:100%;display:block}.full svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.note{padding:9px 12px;background:#f8e0a5;border-left:4px solid #bb7534;border-radius:4px;margin:12px 0}.text{margin:0}details{border-top:1px solid var(--line);padding-top:10px;margin-top:14px}summary{cursor:pointer;font-weight:700}code{font-size:12px;overflow-wrap:anywhere}ul,ol{padding-left:23px}li{margin:6px 0}.muted{color:#8c6b4b;font-size:13px}.quick{margin-top:10px}.quick button{padding:6px 10px;font-size:14px}#count{margin:0 0 8px;color:#8c633f}.scope{max-width:1420px;margin:0 auto 25px;padding:0 24px;color:#d8d6be;font-size:13px}@media(max-width:900px){main{grid-template-columns:1fr}aside{position:static;max-height:260px}}@media print{body{background:white}aside,nav,.quick{display:none}main{display:block}header,.scope{color:#60391f}header p{color:#60391f}article{border:0}}
.triple{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:700px){.triple{grid-template-columns:1fr}}</style>
<header><h1>灯火大排档 · 四页视觉问题清单</h1><div class="metrics" id="summary">正在载入走查记录…</div><p>逐项查看原稿与修复结果。此页保留原稿、修复前和修复后三组证据，31项均附具体处理说明。</p><nav><select id="page" aria-label="按页面筛选"><option value="all">全部页面</option></select><select id="priority" aria-label="按优先级筛选"><option value="all">全部优先级</option><option value="高">高优先级</option><option value="中">中优先级</option></select><select id="category" aria-label="按类型筛选"><option value="all">全部类型</option></select><a href="../../docs/lobby-visual-audit.json" style="color:#ffda96">完整结构化清单</a><a href="../lobby-review.html" style="color:#ffda96">可操作原稿对照</a></nav><nav class="quick"><button data-issue="A01">家常现炒字样</button><button data-issue="S01">缺失的备菜架</button><button data-issue="A02">布置按钮弧度</button><button data-issue="A04">多余蒙层边缘</button></nav></header>
<main><aside><p id="count"></p><div id="issues"></div></aside><article id="detail"></article></main>
<p class="scope">浏览器中的左右页面按同尺寸420×840显示后截图；局部放大用于观察轮廓和材质，不是逐像素误差计算。使用隔离回放档案，不读取或改动玩家存档。</p>
<script>
(async()=>{
  const report=await fetch('../../docs/lobby-visual-audit.json').then(r=>r.json()),byPage=Object.fromEntries(report.pages.map(p=>[p.id,p]));
  const page=document.querySelector('#page'),priority=document.querySelector('#priority'),category=document.querySelector('#category'),detail=document.querySelector('#detail'),list=document.querySelector('#issues');
  document.querySelector('#summary').textContent=report.date+' · '+report.summary.total+'项已修复 · 高优先级'+report.summary.high+'项 · 中优先级'+report.summary.medium+'项';
  for(const p of report.pages){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;page.append(o);}for(const value of new Set(report.issues.map(i=>i.category))){const o=document.createElement('option');o.value=value;o.textContent=value;category.append(o);}
  let selected=report.issues.find(i=>i.id===location.hash.slice(1))||report.issues[0],paint=0;
  function el(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;}
  function section(title,text,parent=detail){parent.append(el('h3',title),el('p',text,'text'));}
  function noteList(title,items){const d=el('details'),s=el('summary',title),ul=el('ul');for(const i of items)ul.append(el('li',typeof i==='string'?i:i.title+'：'+(i.detail||i.gate||'')));d.append(s,ul);detail.append(d);}
  function frame(src,caption,box){const f=el('figure'),cap=el('figcaption',caption),wrap=el('div',undefined,'full'),im=el('img');im.src=src;im.alt=caption;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 887 1774');const r=document.createElementNS(svg.namespaceURI,'rect');for(const[k,v]of Object.entries({x:box[0],y:box[1],width:box[2],height:box[3],fill:'#f36f2722',stroke:'#f35b26','stroke-width':5}))r.setAttribute(k,v);svg.append(r);wrap.append(im,svg);f.append(cap,wrap);return f;}
  async function crop(canvas,src,b){const im=new Image;im.src=src;await im.decode();const c=canvas.getContext('2d'),scale=im.naturalWidth/887;canvas.width=680;canvas.height=440;c.fillStyle='#f2e6cc';c.fillRect(0,0,680,440);const s=Math.min(660/b[2],420/b[3]);c.drawImage(im,b[0]*scale,b[1]*scale,b[2]*scale,b[3]*scale,(680-b[2]*s)/2,(440-b[3]*s)/2,b[2]*s,b[3]*s);}
  async function show(issue){
    selected=issue;history.replaceState(null,'','#'+issue.id);renderList();const version=++paint,p=byPage[issue.page];detail.replaceChildren(el('h2',issue.id+' · '+issue.title),el('div',issue.scope+' · '+issue.category+' · '+issue.priority+'优先级 · '+issue.status,'meta'),el('p','示例取自「'+p.name+'」'+(issue.affectedPages?'；同类影响：'+issue.affectedPages.map(id=>byPage[id].name).join('、'):'') ,'muted'));
    const pair=el('div',undefined,'comparison triple'),left=el('figure'),before=el('figure'),right=el('figure'),lc=el('canvas',undefined,'crop'),bc=el('canvas',undefined,'crop'),rc=el('canvas',undefined,'crop');left.append(el('figcaption','原视觉稿'),lc);before.append(el('figcaption','修复前'),bc);right.append(el('figcaption','修复后 Web'),rc);pair.append(left,before,right);detail.append(pair);
    if(issue.stateNote)detail.append(el('p',issue.stateNote,'note'));
    section('原稿是什么',issue.reference);section('修复前问题',issue.current);section('原问题原因',issue.cause);section('本次修复',issue.resolution);section('处理依据',issue.action);section('怎样验收',issue.acceptance);
    const full=el('details'),pictures=el('div',undefined,'comparison');pictures.append(frame('reference-'+issue.page+'.jpg','原稿中的位置',issue.box),frame(issue.actualImage||'actual-'+issue.page+'.jpg','修复后页面中的位置',issue.box));full.append(el('summary','查看整页位置'),pictures);detail.append(full);
    const code=el('details'),refs=el('ul');for(const r of issue.code)refs.append(el('li',r.file+(r.line?':'+r.line:'')+' — '+r.reason));code.append(el('summary','查看实现依据'),refs);detail.append(code);
    noteList('本次统一的还原原则',report.principles);noteList('这些业务差异不当作美术错误',report.notVisualDefects);noteList('已确定的基准与适用边界',report.needsBaseline);noteList('修复顺序',report.fixOrder);
    await Promise.all([crop(lc,'reference-'+issue.page+'.jpg',issue.box),crop(bc,'before-actual-'+issue.page+'.jpg',issue.box),crop(rc,issue.actualImage||'actual-'+issue.page+'.jpg',issue.box)]);if(version!==paint)return;
  }
  function filtered(){return report.issues.filter(i=>(page.value==='all'||i.page===page.value||(i.affectedPages||[]).includes(page.value))&&(priority.value==='all'||i.priority===priority.value)&&(category.value==='all'||i.category===category.value));}
  function renderList(){const items=filtered();document.querySelector('#count').textContent='显示 '+items.length+' / '+report.issues.length+' 项；共用问题不重复计数';list.replaceChildren(...items.map(i=>{const b=el('button',undefined,'item'+(i.id===selected.id?' selected':''));b.append(el('span',i.id+' · '+i.title),el('small',i.scope+' / '+i.category+' / '+i.priority+'优先级',i.priority==='高'?'high':'medium'));b.onclick=()=>show(i);return b;}));}
  for(const control of [page,priority,category])control.onchange=()=>{renderList();const first=filtered()[0];if(first&&!filtered().includes(selected))show(first);};
  document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>{page.value=priority.value=category.value='all';show(report.issues.find(i=>i.id===b.dataset.issue));});show(selected);
})().catch(e=>{document.querySelector('#summary').textContent='清单载入失败：'+e.message;console.error(e);});
</script></html>
