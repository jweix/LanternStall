(async()=>{const index=await(await fetch('../../shared/assets/runtime/asset-index.json')).json();const images=Object.fromEntries(await Promise.all(Object.entries(index).map(async([id,a])=>{const im=new Image();im.src='../../shared/assets/runtime/'+a.path.split('/').pop();await im.decode();return[id,im];})));const [recipes,ingredients,layout]=await Promise.all(['recipes','ingredients','layout'].map(n=>fetch('../../shared/data/'+n+'.json').then(r=>r.json())));const font=new FontFace('LanternBody','url(../../shared/assets/lobby/fonts/LanternBody.ttf)');await font.load();document.fonts.add(font);const app=new DapaidangApp.App({recipes,layout,now:()=>Date.parse('2026-11-16T12:00:00+08:00')});for(let n=1;n<=4;n++){app.start(n);const s=app.session;for(const id of s.config.solution){if(!s.pointer(s.engine.nodes.find(t=>t.id===id)))throw Error('Invalid solution');s.advance(.3);if(s.engine.wok||s.engine.queue.length||s.engine.deliveries.length)s.advance(10);}s.advance(10);if(n<4)app.home(true);}DapaidangStallScene.createRenderer(document.getElementById('game').getContext('2d'),images,{recipes,ingredients,layout,assets:index,lobbyBodyFont:'LanternBody'}).draw(app.view(),{width:928,height:1695,dpr:1});document.getElementById('status').textContent='真实引擎通关后的结算预览';})().catch(e=>document.getElementById('status').textContent=e.message);
